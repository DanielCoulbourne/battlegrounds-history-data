name: validate

on:
  push:
  pull_request:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Validate every example against the current schema
        run: npm run validate
      - name: Prove the 1.1 additions did not break 1.0
        run: npm run validate:1.0
