name: validate

on:
  push:
  pull_request:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Validate every example against the current schema
        run: npm run validate
      - name: Prove the 1.1 additions did not break 1.0
        run: npm run validate:1.0

  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Vet and test
        working-directory: converter
        run: |
          gofmt -l . | tee /tmp/fmt
          test ! -s /tmp/fmt
          go vet ./...
          go test ./...

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Convert a log and validate the result against the schema
        run: |
          cd converter && go run ./cmd/bgh-convert -o ../out testdata/synthetic.log && cd ..
          node tools/validate.mjs out/*.json
